; qBittorrent-nox — 100% del tráfico por SOCKS5 wireproxy 127.0.0.1:1080
; Configurar proxy en Preferences -> Connection o vía setup_wireproxy.sh

[program:qbittorrent]
command=/usr/bin/qbittorrent-nox --webui-port=8081 --profile=/var/lib/arrmux/qbittorrent
directory=/var/lib/arrmux/qbittorrent
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/arrmux/qbittorrent.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=QBITTORRENT_PROFILE="/var/lib/arrmux/qbittorrent",QBT_WEBUI_PORT="8081"
