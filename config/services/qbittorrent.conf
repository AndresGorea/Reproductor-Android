; qBittorrent-nox — todo el tráfico por SOCKS5 wireproxy 127.0.0.1:1080
; (proxy impuesto en qBittorrent.conf por setup_qbittorrent.sh).

[program:qbittorrent]
command=/usr/bin/qbittorrent-nox --webui-port=8081 --profile=@@DATA_ROOT@@/qbittorrent
directory=@@DATA_ROOT@@/qbittorrent
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/qbittorrent.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=QBITTORRENT_PROFILE="@@DATA_ROOT@@/qbittorrent",QBT_WEBUI_PORT="8081"
