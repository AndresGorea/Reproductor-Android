; Perfil full: solo se instala con ./install.sh --full (por defecto desactivado).
; Prowlarr (.NET embebido en el tarball linux netcore-arm64)

[program:prowlarr]
command=@@ARRMUX_ROOT@@/apps/prowlarr/Prowlarr --data=@@DATA_ROOT@@/prowlarr -nobrowser
directory=@@DATA_ROOT@@/prowlarr
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/prowlarr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=DOTNET_BUNDLE_EXTRACT_BASE_DIR="@@DATA_ROOT@@/.dotnet",PROWLARR_DATA="@@DATA_ROOT@@/prowlarr"
