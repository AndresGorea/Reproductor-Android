; Perfil full: solo se instala con ./install.sh --full (por defecto desactivado).
; Radarr v5 (.NET embebido en el tarball linux-arm64)

[program:radarr]
command=@@ARRMUX_ROOT@@/apps/radarr/Radarr --data=@@DATA_ROOT@@/radarr -nobrowser
directory=@@DATA_ROOT@@/radarr
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/radarr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=DOTNET_BUNDLE_EXTRACT_BASE_DIR="@@DATA_ROOT@@/.dotnet",RADARR_DATA="@@DATA_ROOT@@/radarr"
