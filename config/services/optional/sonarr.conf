; Perfil full: solo se instala con ./install.sh --full (por defecto desactivado).
; Sonarr v4 (.NET embebido en el tarball linux-arm64)

[program:sonarr]
command=@@ARRMUX_ROOT@@/apps/sonarr/Sonarr --data=@@DATA_ROOT@@/sonarr -nobrowser
directory=@@DATA_ROOT@@/sonarr
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/sonarr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=DOTNET_BUNDLE_EXTRACT_BASE_DIR="@@DATA_ROOT@@/.dotnet",SONARR_DATA="@@DATA_ROOT@@/sonarr"
