; Perfil full: solo se instala con ./install.sh --full (por defecto desactivado).
; Bazarr (Python, venv en ARRMUX_ROOT)

[program:bazarr]
command=@@ARRMUX_ROOT@@/bazarr-venv/bin/python @@ARRMUX_ROOT@@/apps/bazarr/bazarr.py --config @@DATA_ROOT@@/bazarr
directory=@@DATA_ROOT@@/bazarr
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/bazarr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=BAZARR_CONFIG="@@DATA_ROOT@@/bazarr",PYTHONUNBUFFERED="1"
