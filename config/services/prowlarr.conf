; Prowlarr (.NET incluido en tarball linux-core-arm64)

[program:prowlarr]
command=/opt/arrmux/prowlarr/Prowlarr --data=/var/lib/arrmux/prowlarr -nobrowser
directory=/var/lib/arrmux/prowlarr
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/arrmux/prowlarr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=DOTNET_SYSTEM_GLOBALIZATION_INVARIANT="1",PROWLARR_DATA="/var/lib/arrmux/prowlarr"
