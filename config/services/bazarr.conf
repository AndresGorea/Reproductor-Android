; Bazarr (Python, venv en /opt/arrmux/bazarr-venv)

[program:bazarr]
command=/opt/arrmux/bazarr-venv/bin/python /opt/arrmux/bazarr/bazarr.py --config /var/lib/arrmux/bazarr
directory=/var/lib/arrmux/bazarr
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/arrmux/bazarr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=BAZARR_CONFIG="/var/lib/arrmux/bazarr",PYTHONUNBUFFERED="1"
