; Sonarr v4 (.NET incluido en tarball linux-core-arm64)

[program:sonarr]
command=/opt/arrmux/sonarr/Sonarr --data=/var/lib/arrmux/sonarr -nobrowser
directory=/var/lib/arrmux/sonarr
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/arrmux/sonarr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=DOTNET_SYSTEM_GLOBALIZATION_INVARIANT="1",SONARR_DATA="/var/lib/arrmux/sonarr"
