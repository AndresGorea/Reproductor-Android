; wireproxy — userspace, reemplazo de Gluetun (sin TUN/TAP/iptables)
; SOCKS5 en 127.0.0.1:1080 para qBittorrent.

[program:wireproxy]
command=@@ARRMUX_ROOT@@/bin/wireproxy --config @@CONF_DIR@@/wireproxy.conf
directory=@@DATA_ROOT@@/wireproxy
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/wireproxy.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
