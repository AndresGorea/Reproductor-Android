; wireproxy — reemplazo userspace de Gluetun (sin TUN/TAP/iptables)
; Expone SOCKS5 en 127.0.0.1:1080 para qBittorrent

[program:wireproxy]
command=/opt/arrmux/bin/wireproxy --config /etc/arrmux/wireproxy.conf
directory=/var/lib/arrmux/wireproxy
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/arrmux/wireproxy.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
