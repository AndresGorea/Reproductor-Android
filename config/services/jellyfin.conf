; Jellyfin portable arm64 (binario propio, sin apt; PRoot-friendly)
; datadir/cachedir internos a DATA_ROOT (sqlite fuera de FUSE).

[program:jellyfin]
command=@@ARRMUX_ROOT@@/apps/jellyfin/jellyfin --datadir @@DATA_ROOT@@/jellyfin/data --cachedir @@DATA_ROOT@@/jellyfin/cache --configdir @@DATA_ROOT@@/jellyfin/config --logdir @@LOG_DIR@@
directory=@@DATA_ROOT@@/jellyfin
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/jellyfin.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=JELLYFIN_DATA_DIR="@@DATA_ROOT@@/jellyfin/data",JELLYFIN_CACHE_DIR="@@DATA_ROOT@@/jellyfin/cache",JELLYFIN_CONFIG_DIR="@@DATA_ROOT@@/jellyfin/config",JELLYFIN_LOG_DIR="@@LOG_DIR@@"
