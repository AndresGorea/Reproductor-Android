; Jellyfin — gestionado por supervisord (arrmux)
; Requiere: apt install jellyfin (repo https://repo.jellyfin.org/debian) o binario en /usr/bin/jellyfin

[program:jellyfin]
command=/usr/bin/jellyfin --datadir /var/lib/arrmux/jellyfin/data --configdir /etc/arrmux/jellyfin --logdir /var/log/arrmux
directory=/var/lib/arrmux/jellyfin
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/arrmux/jellyfin.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=JELLYFIN_DATA_DIR="/var/lib/arrmux/jellyfin/data",JELLYFIN_CONFIG_DIR="/etc/arrmux/jellyfin",JELLYFIN_LOG_DIR="/var/log/arrmux"
