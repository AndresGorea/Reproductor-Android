; Radarr (.NET incluido en tarball linux-core-arm64)

[program:radarr]
command=/opt/arrmux/radarr/Radarr --data=/var/lib/arrmux/radarr -nobrowser
directory=/var/lib/arrmux/radarr
user=root ; cambiar al usuario PRoot si no se corre como root
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/arrmux/radarr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=DOTNET_SYSTEM_GLOBALIZATION_INVARIANT="1",RADARR_DATA="/var/lib/arrmux/radarr"
