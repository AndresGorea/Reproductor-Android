; arrmux — supervisord maestro (plantilla: install.sh sustituye @RUTAS@)
; El socket vive en DATA_ROOT (filesystem interno). NUNCA en /sdcard (FUSE).

[unix_http_server]
file=@@DATA_ROOT@@/supervisor.sock
chmod=0700

[supervisord]
logfile=@@LOG_DIR@@/supervisord.log
pidfile=@@DATA_ROOT@@/supervisord.pid
childlogdir=@@LOG_DIR@@
nodaemon=false
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://@@DATA_ROOT@@/supervisor.sock

[inet_http_server]
port=127.0.0.1:9001

[include]
files=@@CONF_DIR@@/services/*.conf
