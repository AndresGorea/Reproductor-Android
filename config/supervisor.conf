; arrmux supervisord master config
; install.sh lo copia a /etc/arrmux/supervisor.conf
; y los programs viven en /etc/arrmux/services/*.conf

[unix_http_server]
file=/tmp/supervisor-arrmux.sock
chmod=0700

[supervisord]
logfile=/var/log/arrmux/supervisord.log
pidfile=/tmp/supervisord-arrmux.pid
childlogdir=/var/log/arrmux
nodaemon=false
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor-arrmux.sock

[include]
files=/etc/arrmux/services/*.conf
